name: Release

# Builds both platforms on a version tag and publishes a GitHub Release
# with the APK attached (IPA artifact included on the release run).
on:
  push:
    tags:
      - 'v*'

defaults:
  run:
    working-directory: uniflow

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Run tests
        run: flutter test

      - name: Build Android (release APK)
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: uniflow/build/app/outputs/flutter-apk/app-release.apk

  build-ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build iOS (no codesign)
        run: flutter build ios --release --no-codesign

      - name: Create IPA
        run: |
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -r UniFlow.ipa Payload
          rm -rf Payload

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-ipa
          path: uniflow/UniFlow.ipa

  release:
    needs: [build-android, build-ios]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Checked out to a subdirectory (ref: main) so the downloaded
      # artifacts keep living in the workspace root untouched.
      - uses: actions/checkout@v5
        with:
          ref: main
          path: repo

      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: app-release-apk

      - name: Download IPA
        uses: actions/download-artifact@v4
        with:
          name: app-release-ipa

      # GitHub shows artifacts under their file name: ship human-readable
      # names (UniFlow-v1.0.0.apk) instead of the Flutter default
      # "app-release.apk". Artifacts land in the workspace root, while
      # run steps default to uniflow/ — override for this step.
      - name: Name release assets
        working-directory: ${{ github.workspace }}
        run: |
          mv app-release.apk "UniFlow-${GITHUB_REF_NAME}.apk"
          mv UniFlow.ipa "UniFlow-${GITHUB_REF_NAME}.ipa"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            UniFlow-*.apk
            UniFlow-*.ipa
          generate_release_notes: true

      # The SideStore source must point at this fresh release: rewrite
      # version/date/URL/size and push the change back to main, so nobody
      # ever has to edit sidestore/source.json by hand.
      - name: Update SideStore source
        working-directory: ${{ github.workspace }}/repo
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          DATE="$(date -u +%F)"
          URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/UniFlow-${GITHUB_REF_NAME}.ipa"
          SIZE="$(stat -c%s "../UniFlow-${GITHUB_REF_NAME}.ipa")"
          jq --arg v "$VERSION" --arg d "$DATE" --arg u "$URL" --argjson s "$SIZE" '
            .apps[0].version = $v
            | .apps[0].versionDate = $d
            | .apps[0].downloadURL = $u
            | .apps[0].size = $s
            | .apps[0].versions |= ([{version: $v, date: $d, downloadURL: $u, size: $s}] + .)
            | .apps[0].versions |= (unique_by(.version) | sort_by(.version) | reverse | .[0:10])
          ' sidestore/source.json > sidestore/source.json.tmp
          mv sidestore/source.json.tmp sidestore/source.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sidestore/source.json
          if git diff --cached --quiet; then
            echo "sidestore/source.json is already up to date"
            exit 0
          fi
          git commit -m "chore(release): update SideStore source to ${GITHUB_REF_NAME}"
          git pull --rebase origin main
          git push origin main
