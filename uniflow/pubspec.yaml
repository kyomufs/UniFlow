name: uniflow
description: "UniFlow — Расписание ТулГУ"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.4.9

  # Network
  dio: ^5.4.1

  # Local Storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # Navigation
  go_router: ^13.1.0

  # UI
  gap: ^3.0.1

  # Localization
  flutter_localizations:
    sdk: flutter

  # Utils
  intl: ^0.20.3

  # Icons
  cupertino_icons: ^1.0.6
  flutter_local_notifications: ^22.3.1
  url_launcher: ^6.3.2
  package_info_plus: ^10.2.1
  path_provider: ^2.1.6

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true

  fonts:
    - family: Rubik
      fonts:
        - asset: assets/fonts/Rubik-Regular.ttf
          weight: 400
        - asset: assets/fonts/Rubik-Medium.ttf
          weight: 500
        - asset: assets/fonts/Rubik-SemiBold.ttf
          weight: 600
